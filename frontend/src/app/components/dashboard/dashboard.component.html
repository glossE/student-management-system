<header class="app-header">
  <div class="app-header__inner">
    <div class="brand">
      <i class="pi pi-graduation-cap"></i>
      <div class="brand__text">
        <h1>Student Management</h1>
        <span>Pillai University</span>
      </div>
    </div>

    <nav class="app-nav">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Students</a>
      @if (auth.isPrincipal()) {
        <a routerLink="/users" routerLinkActive="active">Manage Admins</a>
      }
    </nav>

    @if (auth.user(); as user) {
      <div class="user-box">
        <div class="user-meta">
          <span class="user-name">{{ user.name }}</span>
          <p-tag [value]="user.role" [severity]="auth.isPrincipal() ? 'warn' : 'info'" />
        </div>
        <p-button label="Logout" icon="pi pi-sign-out" severity="secondary" [text]="true" (onClick)="logout()" />
      </div>
    }
  </div>
</header>

<main class="app-main">
  <router-outlet />
</main>

<footer class="app-footer">
  <span>&copy; {{ year }} Pillai University — Student Management System</span>
</footer>
